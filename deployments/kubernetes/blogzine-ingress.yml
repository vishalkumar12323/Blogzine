apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blogzine-ingress
  namespace: blogzine
spec:
  ingressClassName: nginx
  rules:
  - hosts: blogzine.local
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: blogzine-backend-service
            port:
              number: 8080
