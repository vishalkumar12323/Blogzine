apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blogzine-ingress
  namespace: blogzine
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: blogzine-app
            port: 
              number: 8080
