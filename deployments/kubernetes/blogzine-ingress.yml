apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blogzine-ingress
  namespace: blogzine
spec:
  ingressClassName: nginx
  rules:
    - host: blogzine.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blogzine-backend-service
                port:
                  number: 8080

