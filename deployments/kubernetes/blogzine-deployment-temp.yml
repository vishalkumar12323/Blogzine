apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogzine-app
  namespace: blogzine
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blogzine-app
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: blogzine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blogzine-app
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: blogzine
    spec:
      containers:
      - name: blogzine-app-container
        image: vishaldoc502/blogzine:prod
        env:
          - name: MONGODB_HOST
            value: mongodb
          - name: MONGODB_PORT
            value: "27017"
          - name: MONGODB_DATABASE
            value: Blogger
        resources:
          requests:
            memory: "150Mi"
            cpu: "200m"
          limits:
            memory: "200Mi"
            cpu: "300m"
        ports:
        - containerPort: 8080
