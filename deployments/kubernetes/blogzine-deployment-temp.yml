apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogzine-app
  namespace: blogzine
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blogzine-app
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: blogzine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blogzine-app
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: blogzine
    spec:
      containers:
      - name: blogzine-app-container
        image: vishaldoc502/blogzine:prod-v2
        envFrom:
          - configMapRef:
              name: blogzine-app-config
          - secretRef:
              name: blogzine-app-secrets
        resources:
          requests:
            memory: "150Mi"
            cpu: "200m"
          limits:
            memory: "200Mi"
            cpu: "300m"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
