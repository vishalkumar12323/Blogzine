apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogzine-app
  namespace: blogzine
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blogzine-app
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: blogzine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blogzine-app
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: blogzine
    spec:
      containers:
      - name: blogzine-app-container
        image: vishaldoc502/blogzine:prod-v1
        env:
          - name: MONGODB_HOST
            value: mongodb
          - name: MONGODB_PORT
            value: "27017"
          - name: MONGODB_DATABASE
            value: Blogger
          - name: JWT_SECRET
            value: a9954edc4b465111fcd9e6a1337666e93a0ca9dbeadc2bd82db3195c8d6be04ba7b630f1bc3a292c9ea2968d52e349a12377
        resources:
          requests:
            memory: "150Mi"
            cpu: "200m"
          limits:
            memory: "200Mi"
            cpu: "300m"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
